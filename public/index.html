<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tính giờ chấm công</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px 16px;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }
    main {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .08);
    }
    h1 { margin-top: 0; }
    label {
      display: block;
      margin: 14px 0 6px;
      font-weight: 700;
    }
    input, select, button {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    button {
      margin-top: 18px;
      border: 0;
      cursor: pointer;
      background: #111827;
      color: white;
      font-weight: 700;
    }
    button:disabled {
      opacity: .6;
      cursor: wait;
    }
    pre {
      margin-top: 22px;
      padding: 16px;
      min-height: 120px;
      overflow: auto;
      white-space: pre-wrap;
      background: #0f172a;
      color: #e2e8f0;
      border-radius: 8px;
      line-height: 1.55;
    }
    .note {
      font-size: 13px;
      color: #64748b;
    }
    @media (max-width: 600px) {
      .row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Tính giờ chấm công</h1>

    <form id="form">
      <label for="token">Access token</label>
      <input
        id="token"
        type="password"
        autocomplete="off"
        placeholder="Dán token hoặc Bearer token"
        required
      />
      <div class="note">Token không được lưu trên trình duyệt hoặc server.</div>

      <div class="row">
        <div>
          <label for="month">Tháng</label>
          <select id="month" required></select>
        </div>
        <div>
          <label for="year">Năm</label>
          <input id="year" type="number" min="2000" max="2100" required />
        </div>
      </div>

      <button id="submit" type="submit">Tính chấm công</button>
    </form>

    <pre id="output">Nhập token, tháng và năm để xem kết quả.</pre>
  </main>

  <script>
    const form = document.getElementById("form");
    const tokenInput = document.getElementById("token");
    const monthInput = document.getElementById("month");
    const yearInput = document.getElementById("year");
    const output = document.getElementById("output");
    const submitButton = document.getElementById("submit");

    const now = new Date();

    for (let month = 1; month <= 12; month++) {
      const option = document.createElement("option");
      option.value = String(month);
      option.textContent = `Tháng ${month}`;
      option.selected = month === now.getMonth() + 1;
      monthInput.appendChild(option);
    }

    yearInput.value = String(now.getFullYear());

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      submitButton.disabled = true;
      output.textContent = "Đang tải dữ liệu...";

      try {
        const response = await fetch("/api/timesheet", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            token: tokenInput.value,
            month: Number(monthInput.value),
            year: Number(yearInput.value)
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            [data.error, data.detail].filter(Boolean).join("\n")
          );
        }

        output.textContent = data.output;
      } catch (error) {
        output.textContent = `Lỗi: ${error.message}`;
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
