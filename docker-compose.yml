services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: "3000"
      LOCATION_ID: "568"
      DEPARTMENT_ID: "110"
      STAFF_CODE: "241261"
    expose:
      - "3000"

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
